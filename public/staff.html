<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Staff Page — Throne of Shadows</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0a14; color: #e8dfd0;
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh; display: flex; align-items: flex-start; justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%; max-width: 760px; background: #171224;
    border: 1px solid #3a2f52; border-radius: 12px; padding: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,.6); margin-top: 2vh;
  }
  .logo { font-size: 40px; text-align: center; margin-bottom: 6px; }
  h1 { text-align: center; font-size: 20px; color: #f0c75e; margin-bottom: 4px; letter-spacing: .5px; }
  .sub { text-align: center; color: #9a8fb5; font-size: 13px; margin-bottom: 16px; }
  .who { text-align: center; color: #9a8fb5; font-size: 12px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: #b7abd4; margin: 12px 0 6px; }
  input, textarea, select {
    width: 100%; padding: 10px 12px; border-radius: 8px; font-size: 15px; font-family: inherit;
    background: #0d0a14; border: 1px solid #3a2f52; color: #e8dfd0;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #f0c75e; }
  textarea { min-height: 90px; resize: vertical; }
  button {
    padding: 12px 18px; border: none; border-radius: 8px; font-size: 15px;
    font-family: inherit; cursor: pointer; font-weight: bold;
    background: linear-gradient(180deg, #f0c75e, #c9962e); color: #231a08;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: #0d0a14; border: 1px solid #3a2f52; color: #b7abd4; font-weight: normal; }
  button.danger { background: linear-gradient(180deg, #c0392b, #96281b); color: #ffe9e9; }
  button.small { padding: 6px 12px; font-size: 13px; }
  .err { color: #ff8a8a; font-size: 14px; margin-top: 12px; text-align: center; min-height: 20px; }
  .hidden { display: none !important; }
  .back { display: block; text-align: center; margin-top: 16px; color: #9a8fb5; font-size: 13px; text-decoration: none; }
  /* Login pane (narrow) */
  #login-pane { max-width: 380px; margin: 0 auto; }
  #login-pane button { width: 100%; margin-top: 18px; }
  /* Tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button {
    flex: 1; min-width: 120px; background: #0d0a14; border: 1px solid #3a2f52;
    color: #9a8fb5; font-weight: normal; padding: 10px 8px; font-size: 14px;
  }
  .tabs button.active { border-color: #f0c75e; color: #f0c75e; background: rgba(240,199,94,.08); font-weight: bold; }
  .tab-pane { min-height: 200px; }
  /* Entries */
  .entry {
    background: #0d0a14; border: 1px solid #3a2f52; border-radius: 8px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .entry-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .entry-title { font-weight: bold; font-size: 15px; flex: 1; min-width: 140px; }
  .entry-body { font-size: 14px; color: #cfc6dd; white-space: pre-wrap; word-break: break-word; }
  .entry-meta { font-size: 11px; color: #7a7094; margin-top: 8px; }
  .entry-actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .entry-actions select { width: auto; padding: 6px 10px; font-size: 13px; }
  .badge {
    font-size: 11px; font-weight: bold; padding: 2px 10px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .06em; white-space: nowrap;
  }
  .st-new { background: rgba(240,199,94,.15); color: #f0c75e; border: 1px solid rgba(240,199,94,.5); }
  .st-reviewing, .st-open { background: rgba(154,220,255,.12); color: #9adcff; border: 1px solid rgba(154,220,255,.45); }
  .st-fixed, .st-done { background: rgba(127,224,138,.12); color: #7fe08a; border: 1px solid rgba(127,224,138,.45); }
  .st-closed, .st-dropped { background: rgba(154,154,165,.12); color: #9a9aa5; border: 1px solid rgba(154,154,165,.4); }
  .st-planned { background: rgba(196,181,253,.12); color: #c4b5fd; border: 1px solid rgba(196,181,253,.45); }
  .empty { color: #7a7094; font-size: 13px; text-align: center; padding: 20px; }
  .new-idea { background: #0d0a14; border: 1px dashed #3a2f52; border-radius: 8px; padding: 14px; margin-bottom: 16px; }
  .new-idea button { margin-top: 10px; }
  .count { font-size: 12px; color: #7a7094; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🛡️</div>
  <h1>Staff Page</h1>
  <p class="sub">Owner &amp; admin only. Logs, reports, feedback and ideas.</p>

  <div id="login-pane">
    <label for="su">Username</label>
    <input id="su" type="text" autocomplete="username" autocapitalize="none">
    <label for="sp">Password</label>
    <input id="sp" type="password" autocomplete="current-password">
    <button id="login-btn">Sign in</button>
    <div class="err" id="login-err"></div>
    <a class="back" href="/">← Back to game</a>
  </div>

  <div id="ops-pane" class="hidden">
    <div class="who" id="who"></div>
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin:0 0 8px">📢 Update warning</h3>
      <p style="margin:0 0 8px; font-size:13px; color:#9a8fb5">Warn players <b>before</b> a deploy or maintenance. The banner clears itself once the new version is live, and players' games refresh automatically.</p>
      <div id="notice-current" style="font-size:13px; color:#9a8fb5; margin-bottom:8px"></div>
      <input id="notice-msg" type="text" maxlength="200" placeholder="e.g. Update incoming in 2 minutes — your game will refresh" />
      <div style="margin-top:8px; display:flex; gap:8px">
        <button id="notice-warn">Warn players</button>
        <button id="notice-clear" class="ghost">Clear</button>
      </div>
    </div>
    <div class="tabs">
      <button data-tab="audit" class="active">📋 Audit log</button>
      <button data-tab="bugs">🐞 Bugs <span id="cnt-bugs"></span></button>
      <button data-tab="feedback">💬 Feedback <span id="cnt-feedback"></span></button>
      <button data-tab="ideas">💡 Ideas</button>
    </div>
    <div class="err" id="ops-err"></div>

    <div class="tab-pane" id="tab-audit">
      <div class="count" id="audit-count"></div>
      <div id="audit-list"><div class="empty">Loading…</div></div>
    </div>

    <div class="tab-pane hidden" id="tab-bugs"><div id="bugs-list"><div class="empty">Loading…</div></div></div>
    <div class="tab-pane hidden" id="tab-feedback"><div id="feedback-list"><div class="empty">Loading…</div></div></div>

    <div class="tab-pane hidden" id="tab-ideas">
      <div class="new-idea">
        <label for="idea-title">New idea</label>
        <input id="idea-title" type="text" maxlength="120" placeholder="Idea title">
        <label for="idea-body">Details (optional)</label>
        <textarea id="idea-body" maxlength="2000" placeholder="Flesh it out…"></textarea>
        <button id="idea-add">💡 Add idea</button>
      </div>
      <div id="ideas-list"><div class="empty">Loading…</div></div>
    </div>

    <a class="back" href="/">← Back to game</a>
  </div>
</div>

<script src="js/staff.js?v=20261001a"></script>
</body>
</html>
