<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Report a Bug / Feedback — Throne of Shadows</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0a14; color: #e8dfd0;
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh; display: flex; align-items: flex-start; justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%; max-width: 520px; background: #171224;
    border: 1px solid #3a2f52; border-radius: 12px; padding: 28px 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,.6); margin-top: 4vh;
  }
  .hero { display: block; width: 100%; height: 150px; object-fit: cover;
    border-radius: 12px; margin-bottom: 12px; border: 1px solid rgba(240,199,94,.25); }
  h1 { text-align: center; font-size: 20px; color: #f0c75e; margin-bottom: 4px; letter-spacing: .5px; }
  .sub { text-align: center; color: #9a8fb5; font-size: 13px; margin-bottom: 20px; }
  .who { text-align: center; color: #9a8fb5; font-size: 12px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: #b7abd4; margin: 12px 0 6px; }
  input, textarea, select {
    width: 100%; padding: 12px; border-radius: 8px; font-size: 16px; font-family: inherit;
    background: #0d0a14; border: 1px solid #3a2f52; color: #e8dfd0;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #f0c75e; }
  textarea { min-height: 120px; resize: vertical; }
  .kind-row { display: flex; gap: 10px; }
  .kind-row button {
    flex: 1; padding: 12px; border-radius: 8px; font-size: 15px; font-family: inherit; cursor: pointer;
    background: #0d0a14; border: 1px solid #3a2f52; color: #9a8fb5;
  }
  .kind-row button.active { border-color: #f0c75e; color: #f0c75e; background: rgba(240,199,94,.08); }
  button.submit {
    width: 100%; padding: 14px; margin-top: 18px; border: none; border-radius: 8px;
    font-size: 16px; font-family: inherit; cursor: pointer; font-weight: bold;
    background: linear-gradient(180deg, #f0c75e, #c9962e); color: #231a08;
  }
  button.submit:disabled { opacity: .5; cursor: default; }
  .err { color: #ff8a8a; font-size: 14px; margin-top: 12px; text-align: center; min-height: 20px; }
  .okmsg { color: #7fe08a; font-size: 14px; margin-top: 12px; text-align: center; min-height: 20px; }
  .hidden { display: none !important; }
  .back { display: block; text-align: center; margin-top: 16px; color: #9a8fb5; font-size: 13px; text-decoration: none; }
  h2 { font-size: 16px; color: #f0c75e; margin: 26px 0 10px; letter-spacing: .5px; }
  .rep {
    background: #0d0a14; border: 1px solid #3a2f52; border-radius: 8px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .rep-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .rep-title { font-weight: bold; font-size: 15px; flex: 1; min-width: 0; }
  .rep-kind { font-size: 12px; color: #9a8fb5; }
  .rep-body { font-size: 14px; color: #cfc6dd; white-space: pre-wrap; word-break: break-word; }
  .rep-ts { font-size: 11px; color: #7a7094; margin-top: 8px; }
  .badge {
    font-size: 11px; font-weight: bold; padding: 2px 10px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .06em; white-space: nowrap;
  }
  .st-new { background: rgba(240,199,94,.15); color: #f0c75e; border: 1px solid rgba(240,199,94,.5); }
  .st-reviewing { background: rgba(154,220,255,.12); color: #9adcff; border: 1px solid rgba(154,220,255,.45); }
  .st-fixed { background: rgba(127,224,138,.12); color: #7fe08a; border: 1px solid rgba(127,224,138,.45); }
  .st-closed { background: rgba(154,154,165,.12); color: #9a9aa5; border: 1px solid rgba(154,154,165,.4); }
  .empty { color: #7a7094; font-size: 13px; text-align: center; padding: 12px; }
</style>
</head>
<body>
<div class="card">
  <img class="hero" src="img/ladybug-sunset.webp" alt="Ladybug on a leaf at sunset">
  <h1>Bug Reports &amp; Feedback</h1>
  <p class="sub">Found something broken? Got an idea for the game? Tell us here.</p>

  <div id="signin-pane">
    <p class="sub">Sign in to send a report.</p>
    <label for="ru">Username</label>
    <input id="ru" type="text" autocomplete="username" autocapitalize="none">
    <label for="rp">Password</label>
    <input id="rp" type="password" autocomplete="current-password">
    <button class="submit" id="signin-btn" style="margin-top:14px">Sign in</button>
    <div class="err" id="signin-err"></div>
    <a class="back" href="/">← Back to game</a>
  </div>

  <div id="form-pane" class="hidden">
    <div class="who" id="who"></div>
    <label>What is this?</label>
    <div class="kind-row">
      <button type="button" id="kind-bug" class="active">🐞 Bug report</button>
      <button type="button" id="kind-feedback">💬 Feedback</button>
    </div>
    <label for="f-title">Title</label>
    <input id="f-title" type="text" maxlength="120" placeholder="e.g. Mining button does nothing on Android">
    <label for="f-body">Details</label>
    <textarea id="f-body" maxlength="2000" placeholder="What happened? What did you expect? Steps to reproduce…"></textarea>
    <button class="submit" id="send-btn">Send report</button>
    <div class="err" id="form-err"></div>
    <div class="okmsg" id="form-ok"></div>

    <h2>Your reports</h2>
    <div id="mine-list"><div class="empty">Loading…</div></div>
    <a class="back" href="/">← Back to game</a>
  </div>
</div>

<script>
(function () {
  var kind = 'bug';
  var kindBug = document.getElementById('kind-bug');
  var kindFb = document.getElementById('kind-feedback');

  function api(path, opts) {
    return fetch(path, Object.assign({ credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' } }, opts || {}));
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtTs(ts) {
    try {
      return new Date(Number(ts)).toLocaleString(undefined, {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: 'numeric', minute: '2-digit'
      });
    } catch (e) { return ''; }
  }

  kindBug.addEventListener('click', function () {
    kind = 'bug';
    kindBug.classList.add('active'); kindFb.classList.remove('active');
  });
  kindFb.addEventListener('click', function () {
    kind = 'feedback';
    kindFb.classList.add('active'); kindBug.classList.remove('active');
  });

  function renderMine(reports) {
    var list = document.getElementById('mine-list');
    if (!reports.length) {
      list.innerHTML = '<div class="empty">No reports yet — yours will show up here.</div>';
      return;
    }
    list.innerHTML = reports.map(function (r) {
      var updated = (r.updated_at && r.updated_at !== r.created_at)
        ? ' · updated ' + fmtTs(r.updated_at) : '';
      return '<div class="rep">' +
        '<div class="rep-head"><span class="rep-title">' + esc(r.title) + '</span>' +
        '<span class="badge st-' + esc(r.status) + '">' + esc(r.status) + '</span></div>' +
        '<div class="rep-kind">' + (r.kind === 'bug' ? '🐞 Bug' : '💬 Feedback') + '</div>' +
        '<div class="rep-body">' + esc(r.body) + '</div>' +
        '<div class="rep-ts">Sent ' + fmtTs(r.created_at) + updated + '</div>' +
        '</div>';
    }).join('');
  }

  function loadMine() {
    api('/api/report/mine').then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.ok) renderMine(j.reports || []);
    }).catch(function () {});
  }

  document.getElementById('send-btn').addEventListener('click', function () {
    var errEl = document.getElementById('form-err');
    var okEl = document.getElementById('form-ok');
    errEl.textContent = ''; okEl.textContent = '';
    var title = document.getElementById('f-title').value.trim();
    var body = document.getElementById('f-body').value.trim();
    if (!title) { errEl.textContent = 'Give your report a title.'; return; }
    if (!body) { errEl.textContent = 'Add some details.'; return; }
    var btn = this; btn.disabled = true;
    api('/api/report', { method: 'POST', body: JSON.stringify({ kind: kind, title: title, body: body }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        btn.disabled = false;
        if (!res.ok) { errEl.textContent = (res.j && res.j.error) || 'Could not send.'; return; }
        document.getElementById('f-title').value = '';
        document.getElementById('f-body').value = '';
        okEl.textContent = 'Report sent — thank you!';
        loadMine();
      })
      .catch(function () { btn.disabled = false; errEl.textContent = 'Could not reach server.'; });
  });

  // Signed-in players only. The game and this page share the same session.
  function showForm(username) {
    document.getElementById('who').textContent = 'Signed in as ' + username;
    document.getElementById('signin-pane').classList.add('hidden');
    document.getElementById('form-pane').classList.remove('hidden');
    loadMine();
  }

  document.getElementById('signin-btn').addEventListener('click', function () {
    var errEl = document.getElementById('signin-err');
    errEl.textContent = '';
    var u = document.getElementById('ru').value.trim();
    var p = document.getElementById('rp').value;
    if (!u || !p) { errEl.textContent = 'Enter username and password.'; return; }
    var btn = this; btn.disabled = true;
    api('/api/auth/login', { method: 'POST', body: JSON.stringify({ username: u, password: p }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        btn.disabled = false;
        if (!res.ok || !res.j || !res.j.user) {
          errEl.textContent = (res.j && res.j.error) || 'Sign-in failed.';
          return;
        }
        showForm(res.j.user.username || u);
      })
      .catch(function () { btn.disabled = false; errEl.textContent = 'Could not reach server.'; });
  });
  document.getElementById('rp').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('signin-btn').click();
  });

  api('/api/auth/me').then(function (r) { return r.ok ? r.json() : null; }).then(function (me) {
    if (me && me.user) {
      showForm(me.user.username);
    }
  }).catch(function () {});
})();
</script>
</body>
</html>
